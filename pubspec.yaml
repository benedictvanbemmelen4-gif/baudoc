name: baudoc
description: BauDoc – Baustellen-Dokumentation (Flutter/Dart-Portierung des HTML-Prototyps)
publish_to: 'none'
version: 1.0.0+1

environment:
  # Untergrenze von 3.0.0 angehoben: flutter_local_notifications und timezone
  # verlangen mindestens Dart 3.10.
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  web: ^1.1.1
  share_plus: ^13.2.0
  pdf: ^3.11.1
  geolocator: ^13.0.0
  http: ^1.2.0
  # Deep-Link in die Karten-App (Android/iOS/Web) – siehe
  # lib/timetracking/services/navigation_launcher.dart
  url_launcher: ^6.3.1

  # ---- Automatische Zeiterfassung (nur Android wirksam) ----
  # Geofences über die Plattform-API: das Betriebssystem verwaltet sie und
  # weckt die App beim Übertritt, auch wenn sie beendet wurde. Dadurch
  # braucht die automatische Erfassung keinen Dauerdienst.
  native_geofence: ^1.3.1
  # Benachrichtigungen mit Aktions-Buttons + geplante Alarme (Pause,
  # Vorwarnung, Kappung). Ersetzt zugleich den Vordergrunddienst durch eine
  # feste Benachrichtigung, solange der Timer läuft.
  flutter_local_notifications: ^22.3.0
  # zonedSchedule braucht eine Zeitzonendatenbank.
  timezone: ^0.11.1
  # Baustellenadresse → Koordinaten für den Geofence.
  geocoding: ^5.0.0

  # ---- Backend (Firebase-Projekt baudoc-c54a9) ----
  # Die Grundverbindung. Datenbank und Dateiablage kommen in eigenen Schritten
  # dazu – siehe die Zugangsdaten in lib/firebase_options.dart (enthält keine
  # Geheimnisse und gehört bewusst ins Repository).
  firebase_core: ^4.13.0
  # Anmeldung mit E-Mail und Passwort. Hält die Sitzung selbst über
  # Neustarts hinweg – deshalb muss sich niemand täglich neu anmelden.
  firebase_auth: ^6.4.0
  # Ruft die Funktionen unter functions/ auf. Benutzer *anlegen* muss auf dem
  # Server passieren: täte es die App selbst, würde das Gerät sofort als der
  # neue Benutzer angemeldet und der Administrator wäre draußen.
  cloud_functions: ^6.1.0
  # Die gemeinsame Datenbank. Bringt lokale Zwischenspeicherung und das
  # Nachreichen offline entstandener Änderungen mit – deshalb braucht BauDoc
  # keine eigene Synchronisierung.
  cloud_firestore: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Firestore-Nachbau für Tests: die Umsetzung lässt sich damit prüfen, ohne
  # dass ein Projekt im Netz nötig wäre.
  fake_cloud_firestore: ^4.0.0

flutter:
  uses-material-design: true
